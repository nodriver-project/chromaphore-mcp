name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck
        working-directory: server
        run: npx tsc --noEmit

      - name: Conventions, map, and bundle check
        run: node tools/check_conventions.mjs --check-bundle

      - name: Unit tests (browserless)
        working-directory: server
        run: |
          node test/ids_unit.mjs
          node test/bursts_unit.mjs
          node test/canvas_unit.mjs
          node test/video_unit.mjs
          node test/conventions_unit.mjs
